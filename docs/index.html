<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎾 Tennis Players · Top </title>
  <!-- external CSS: assets/css/style.css -->
  <link rel="stylesheet" href="assets/css/style.css" />
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>
        🎾 Tennis Players
        <small>top · men & women</small>
      </h1>
      <div class="subhead">
        <div class="gender-tabs">
          <button class="gender-tab active" data-gender="all">All</button>
          <button class="gender-tab" data-gender="men">Men</button>
          <button class="gender-tab" data-gender="women">Women</button>
        </div>
        <div class="filter-sort">
          <label for="sortSelect"><i class="fas fa-arrow-up-wide-short"></i> Sort</label>
          <select id="sortSelect">
            <option value="ranking">Ranking ▲</option>
            <option value="name">Name</option>
            <option value="utr">UTR ▲</option>
          </select>
        </div>
      </div>
    </header>

    <!-- waterfall grid -->
    <div id="waterfallGrid" class="waterfall"></div>

    <footer>
      <i class="fas fa-database"></i> Data updated monthly · JSON driven · hosted on GitHub
    </footer>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM references
      const grid = document.getElementById('waterfallGrid');
      const sortSelect = document.getElementById('sortSelect');
      const genderTabs = document.querySelectorAll('.gender-tab');

      // state
      let currentGender = 'all';
      let currentSort = 'ranking';
      let playersData = [];

      // --------------------------------------------------------------
      // 1. FETCH JSON from assets/data/players.json
      // --------------------------------------------------------------
      async function loadPlayers() {
        try {
          const response = await fetch('assets/data/players.json');
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const data = await response.json();
          if (Array.isArray(data) && data.length) {
            playersData = data;
          } else {
            console.warn('JSON does not contain an array, using fallback.');
            playersData = getFallbackData();
          }
        } catch (error) {
          console.warn('Failed to load players.json, using fallback data.', error);
          playersData = getFallbackData();
        }
        render();
      }

      // --------------------------------------------------------------
      // 2. FALLBACK data (embedded) – in case JSON fetch fails
      // --------------------------------------------------------------
      function getFallbackData() {
        return [
          { id: 1, name: "Jannik Sinner", gender: "men", nationality: "🇮🇹", height: "188 cm", ranking: 1, utr: 16.12, grandSlams: ["2024 AO"], photo: "assets/images/sinner.jpg" },
          { id: 2, name: "Carlos Alcaraz", gender: "men", nationality: "🇪🇸", height: "183 cm", ranking: 2, utr: 16.08, grandSlams: ["2022 USO", "2023 WB", "2024 FO"], photo: "assets/images/alcaraz.jpg" },
          { id: 3, name: "Novak Djokovic", gender: "men", nationality: "🇷🇸", height: "188 cm", ranking: 3, utr: 15.97, grandSlams: ["24× GS"], photo: "assets/images/djokovic.jpg" },
          { id: 4, name: "Daniil Medvedev", gender: "men", nationality: "🇷🇺", height: "198 cm", ranking: 4, utr: 15.82, grandSlams: ["2021 USO"], photo: "assets/images/medvedev.jpg" },
          { id: 5, name: "Alexander Zverev", gender: "men", nationality: "🇩🇪", height: "198 cm", ranking: 5, utr: 15.76, grandSlams: ["—"], photo: "assets/images/zverev.jpg" },
          { id: 6, name: "Andrey Rublev", gender: "men", nationality: "🇷🇺", height: "188 cm", ranking: 6, utr: 15.58, grandSlams: ["—"], photo: "assets/images/rublev.jpg" },
          { id: 7, name: "Hubert Hurkacz", gender: "men", nationality: "🇵🇱", height: "196 cm", ranking: 7, utr: 15.50, grandSlams: ["—"], photo: "assets/images/hurkacz.jpg" },
          { id: 8, name: "Casper Ruud", gender: "men", nationality: "🇳🇴", height: "183 cm", ranking: 8, utr: 15.42, grandSlams: ["—"], photo: "assets/images/ruud.jpg" },
          { id: 9, name: "Holger Rune", gender: "men", nationality: "🇩🇰", height: "188 cm", ranking: 9, utr: 15.38, grandSlams: ["—"], photo: "assets/images/rune.jpg" },
          { id: 10, name: "Alex de Minaur", gender: "men", nationality: "🇦🇺", height: "183 cm", ranking: 10, utr: 15.30, grandSlams: ["—"], photo: "assets/images/deminaur.jpg" },
          { id: 11, name: "Iga Swiatek", gender: "women", nationality: "🇵🇱", height: "176 cm", ranking: 1, utr: 15.88, grandSlams: ["2020 FO", "2022 FO", "2023 FO", "2024 FO"], photo: "assets/images/swiatek.jpg" },
          { id: 12, name: "Aryna Sabalenka", gender: "women", nationality: "🇧🇾", height: "182 cm", ranking: 2, utr: 15.72, grandSlams: ["2023 AO", "2024 AO"], photo: "assets/images/sabalenka.jpg" },
          { id: 13, name: "Coco Gauff", gender: "women", nationality: "🇺🇸", height: "175 cm", ranking: 3, utr: 15.65, grandSlams: ["2023 USO"], photo: "assets/images/gauff.jpg" },
          { id: 14, name: "Elena Rybakina", gender: "women", nationality: "🇰🇿", height: "184 cm", ranking: 4, utr: 15.60, grandSlams: ["2022 WB"], photo: "assets/images/rybakina.jpg" },
          { id: 15, name: "Jessica Pegula", gender: "women", nationality: "🇺🇸", height: "170 cm", ranking: 5, utr: 15.48, grandSlams: ["—"], photo: "assets/images/pegula.jpg" },
          { id: 16, name: "Maria Sakkari", gender: "women", nationality: "🇬🇷", height: "172 cm", ranking: 6, utr: 15.40, grandSlams: ["—"], photo: "assets/images/sakkari.jpg" },
          { id: 17, name: "Ons Jabeur", gender: "women", nationality: "🇹🇳", height: "167 cm", ranking: 7, utr: 15.32, grandSlams: ["—"], photo: "assets/images/jabeur.jpg" },
          { id: 18, name: "Karolina Muchova", gender: "women", nationality: "🇨🇿", height: "180 cm", ranking: 8, utr: 15.24, grandSlams: ["—"], photo: "assets/images/muchova.jpg" },
          { id: 19, name: "Marketa Vondrousova", gender: "women", nationality: "🇨🇿", height: "172 cm", ranking: 9, utr: 15.18, grandSlams: ["2023 WB"], photo: "assets/images/vondrousova.jpg" },
          { id: 20, name: "Barbora Krejcikova", gender: "women", nationality: "🇨🇿", height: "178 cm", ranking: 10, utr: 15.12, grandSlams: ["2021 FO"], photo: "assets/images/krejcikova.jpg" }
        ];
      }

      // --------------------------------------------------------------
      // 3. RENDER function
      // --------------------------------------------------------------
      function render() {
        let filtered = playersData;
        if (currentGender !== 'all') {
          filtered = filtered.filter(p => p.gender === currentGender);
        }

        const sorted = [...filtered].sort((a, b) => {
          if (currentSort === 'name') {
            return a.name.localeCompare(b.name);
          } else if (currentSort === 'utr') {
            return b.utr - a.utr;
          } else {
            return a.ranking - b.ranking;
          }
        });

        if (sorted.length === 0) {
          grid.innerHTML = `<div class="empty-state"><i class="fas fa-circle-info"></i> No players for this filter</div>`;
          return;
        }

        let html = '';
        sorted.forEach(p => {
          const slamTags = p.grandSlams && p.grandSlams.length
            ? p.grandSlams.map(s => `<span class="history-tag grand-slam">🏆 ${s}</span>`).join('')
            : '<span class="history-tag">—</span>';

          const imgSrc = p.photo && p.photo.trim() !== '' ? p.photo : `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=2e7daf&color=fff&size=100`;

          html += `
            <div class="player-card" data-id="${p.id}">
              <div class="card-content">
                <img class="player-img" src="${imgSrc}" alt="${p.name}" loading="lazy" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=2e7daf&color=fff&size=100'" />
                <div class="info">
                  <div class="name">
                    ${p.name}
                    <span class="flag">${p.nationality || ''}</span>
                  </div>
                  <div class="detail-row">
                    <span><i class="fas fa-ruler-vertical"></i> ${p.height || '—'}</span>
                    <span><i class="fas fa-medal"></i> #${p.ranking}</span>
                    <span class="utr-badge">UTR ${p.utr ? p.utr.toFixed(2) : '—'}</span>
                  </div>
                  <div style="margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap;">
                    <span class="stat-badge"><i class="fas fa-venus-mars"></i> ${p.gender}</span>
                  </div>
                </div>
              </div>
              <div class="history-section">
                <div class="label"><i class="fas fa-trophy"></i> Grand Slam wins</div>
                <div class="history-tags">
                  ${slamTags}
                </div>
              </div>
            </div>
          `;
        });

        grid.innerHTML = html;
      }

      // --------------------------------------------------------------
      // 4. EVENT LISTENERS
      // --------------------------------------------------------------
      genderTabs.forEach(tab => {
        tab.addEventListener('click', function() {
          genderTabs.forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          currentGender = this.dataset.gender;
          render();
        });
      });

      sortSelect.addEventListener('change', function() {
        currentSort = this.value;
        render();
      });

      // --------------------------------------------------------------
      // 5. BOOT: load JSON
      // --------------------------------------------------------------
      loadPlayers();

      // Expose helper for console debugging
      window.__refresh = () => { loadPlayers(); };
      console.log('✅ Tennis Waterfall ready. Data loaded from assets/data/players.json');
      console.log('💡 To force refresh: window.__refresh()');
    })();
  </script>
</body>
</html>
