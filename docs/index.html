<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎾 Tennis Rankings · ATP & WTA Top 20</title>
  <!-- external CSS: assets/css/style.css -->
  <link rel="stylesheet" href="assets/css/style.css" />
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>
        🎾 Tennis Rankings
        <small>Top 20 · ATP & WTA</small>
      </h1>
      <div class="subhead">
        <div class="gender-tabs">
          <button class="gender-tab active" data-gender="men">Men (ATP)</button>
          <button class="gender-tab" data-gender="women">Women (WTA)</button>
        </div>
        <div class="filter-sort">
          <label for="sortSelect"><i class="fas fa-arrow-up-wide-short"></i> Sort</label>
          <select id="sortSelect">
            <option value="ranking">Ranking ▲</option>
            <option value="name">Name</option>
            <option value="points">Points ▲</option>
          </select>
        </div>
      </div>
    </header>

    <!-- waterfall grid -->
    <div id="waterfallGrid" class="waterfall"></div>

    <footer>
      <i class="fas fa-database"></i> Data updated monthly · ATP & WTA Rankings · hosted on GitHub
    </footer>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM references
      const grid = document.getElementById('waterfallGrid');
      const sortSelect = document.getElementById('sortSelect');
      const genderTabs = document.querySelectorAll('.gender-tab');

      // state
      let currentGender = 'men'; // default to men
      let currentSort = 'ranking';
      let playersData = [];

      // --------------------------------------------------------------
      // 1. FETCH JSON from separate files based on gender
      // --------------------------------------------------------------
      async function loadPlayers(gender) {
        try {
          const filePath = gender === 'men' ? 'assets/data/men.json' : 'assets/data/women.json';
          const response = await fetch(filePath);
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const data = await response.json();
          if (Array.isArray(data) && data.length) {
            playersData = data;
          } else {
            console.warn('JSON does not contain an array, using fallback.');
            playersData = getFallbackData(gender);
          }
        } catch (error) {
          console.warn(`Failed to load ${gender}.json, using fallback data.`, error);
          playersData = getFallbackData(gender);
        }
        render();
      }

      // --------------------------------------------------------------
      // 2. FALLBACK data – in case JSON fetch fails
      // --------------------------------------------------------------
      function getFallbackData(gender) {
        if (gender === 'men') {
          return [
            { id: 1, name: "Jannik Sinner", nationality: "🇮🇹", height: "188 cm", ranking: 1, points: 11330, grandSlams: ["2024 AO", "2024 USO"], photo: "assets/images/sinner.jpg" },
            { id: 2, name: "Alexander Zverev", nationality: "🇩🇪", height: "198 cm", ranking: 2, points: 8135, grandSlams: ["—"], photo: "assets/images/zverev.jpg" },
            { id: 3, name: "Carlos Alcaraz", nationality: "🇪🇸", height: "183 cm", ranking: 3, points: 7910, grandSlams: ["2022 USO", "2023 WB", "2024 FO"], photo: "assets/images/alcaraz.jpg" },
            { id: 4, name: "Taylor Fritz", nationality: "🇺🇸", height: "196 cm", ranking: 4, points: 5350, grandSlams: ["—"], photo: "assets/images/fritz.jpg" },
            { id: 5, name: "Daniil Medvedev", nationality: "🇷🇺", height: "198 cm", ranking: 5, points: 5035, grandSlams: ["2021 USO"], photo: "assets/images/medvedev.jpg" },
            { id: 6, name: "Casper Ruud", nationality: "🇳🇴", height: "183 cm", ranking: 6, points: 4565, grandSlams: ["—"], photo: "assets/images/ruud.jpg" },
            { id: 7, name: "Novak Djokovic", nationality: "🇷🇸", height: "188 cm", ranking: 7, points: 4510, grandSlams: ["24× GS"], photo: "assets/images/djokovic.jpg" },
            { id: 8, name: "Andrey Rublev", nationality: "🇷🇺", height: "188 cm", ranking: 8, points: 4420, grandSlams: ["—"], photo: "assets/images/rublev.jpg" },
            { id: 9, name: "Alex de Minaur", nationality: "🇦🇺", height: "183 cm", ranking: 9, points: 4195, grandSlams: ["—"], photo: "assets/images/deminaur.jpg" },
            { id: 10, name: "Tommy Paul", nationality: "🇺🇸", height: "185 cm", ranking: 10, points: 3860, grandSlams: ["—"], photo: "assets/images/paul.jpg" },
            { id: 11, name: "Stefanos Tsitsipas", nationality: "🇬🇷", height: "193 cm", ranking: 11, points: 3775, grandSlams: ["—"], photo: "assets/images/tsitsipas.jpg" },
            { id: 12, name: "Lorenzo Musetti", nationality: "🇮🇹", height: "185 cm", ranking: 12, points: 3650, grandSlams: ["—"], photo: "assets/images/musetti.jpg" },
            { id: 13, name: "Holger Rune", nationality: "🇩🇰", height: "188 cm", ranking: 13, points: 3405, grandSlams: ["—"], photo: "assets/images/rune.jpg" },
            { id: 14, name: "Jack Draper", nationality: "🇬🇧", height: "193 cm", ranking: 14, points: 3365, grandSlams: ["—"], photo: "assets/images/draper.jpg" },
            { id: 15, name: "Grigor Dimitrov", nationality: "🇧🇬", height: "191 cm", ranking: 15, points: 3235, grandSlams: ["—"], photo: "assets/images/dimitrov.jpg" },
            { id: 16, name: "Frances Tiafoe", nationality: "🇺🇸", height: "188 cm", ranking: 16, points: 3045, grandSlams: ["—"], photo: "assets/images/tiafoe.jpg" },
            { id: 17, name: "Hubert Hurkacz", nationality: "🇵🇱", height: "196 cm", ranking: 17, points: 3035, grandSlams: ["—"], photo: "assets/images/hurkacz.jpg" },
            { id: 18, name: "Ben Shelton", nationality: "🇺🇸", height: "193 cm", ranking: 18, points: 3000, grandSlams: ["—"], photo: "assets/images/shelton.jpg" },
            { id: 19, name: "Karen Khachanov", nationality: "🇷🇺", height: "198 cm", ranking: 19, points: 2935, grandSlams: ["—"], photo: "assets/images/khachanov.jpg" },
            { id: 20, name: "Ugo Humbert", nationality: "🇫🇷", height: "188 cm", ranking: 20, points: 2905, grandSlams: ["—"], photo: "assets/images/humbert.jpg" }
          ];
        } else {
          return [
            { id: 21, name: "Iga Swiatek", nationality: "🇵🇱", height: "176 cm", ranking: 1, points: 11185, grandSlams: ["2020 FO", "2022 FO", "2023 FO", "2024 FO"], photo: "assets/images/swiatek.jpg" },
            { id: 22, name: "Aryna Sabalenka", nationality: "🇧🇾", height: "182 cm", ranking: 2, points: 8716, grandSlams: ["2023 AO", "2024 AO"], photo: "assets/images/sabalenka.jpg" },
            { id: 23, name: "Coco Gauff", nationality: "🇺🇸", height: "175 cm", ranking: 3, points: 7633, grandSlams: ["2023 USO"], photo: "assets/images/gauff.jpg" },
            { id: 24, name: "Elena Rybakina", nationality: "🇰🇿", height: "184 cm", ranking: 4, points: 6876, grandSlams: ["2022 WB"], photo: "assets/images/rybakina.jpg" },
            { id: 25, name: "Jasmine Paolini", nationality: "🇮🇹", height: "163 cm", ranking: 5, points: 5353, grandSlams: ["—"], photo: "assets/images/paolini.jpg" },
            { id: 26, name: "Jessica Pegula", nationality: "🇺🇸", height: "170 cm", ranking: 6, points: 4975, grandSlams: ["—"], photo: "assets/images/pegula.jpg" },
            { id: 27, name: "Zheng Qinwen", nationality: "🇨🇳", height: "178 cm", ranking: 7, points: 3985, grandSlams: ["2024 AO"], photo: "assets/images/zheng.jpg" },
            { id: 28, name: "Maria Sakkari", nationality: "🇬🇷", height: "172 cm", ranking: 8, points: 3955, grandSlams: ["—"], photo: "assets/images/sakkari.jpg" },
            { id: 29, name: "Danielle Collins", nationality: "🇺🇸", height: "178 cm", ranking: 9, points: 3722, grandSlams: ["—"], photo: "assets/images/collins.jpg" },
            { id: 30, name: "Barbora Krejcikova", nationality: "🇨🇿", height: "178 cm", ranking: 10, points: 3585, grandSlams: ["2021 FO"], photo: "assets/images/krejcikova.jpg" },
            { id: 31, name: "Emma Navarro", nationality: "🇺🇸", height: "170 cm", ranking: 11, points: 3478, grandSlams: ["—"], photo: "assets/images/navarro.jpg" },
            { id: 32, name: "Daria Kasatkina", nationality: "🇷🇺", height: "170 cm", ranking: 12, points: 3334, grandSlams: ["—"], photo: "assets/images/kasatkina.jpg" },
            { id: 33, name: "Anna Kalinskaya", nationality: "🇷🇺", height: "175 cm", ranking: 13, points: 3175, grandSlams: ["—"], photo: "assets/images/kalinskaya.jpg" },
            { id: 34, name: "Marta Kostyuk", nationality: "🇺🇦", height: "175 cm", ranking: 14, points: 2980, grandSlams: ["—"], photo: "assets/images/kostyuk.jpg" },
            { id: 35, name: "Liudmila Samsonova", nationality: "🇷🇺", height: "180 cm", ranking: 15, points: 2890, grandSlams: ["—"], photo: "assets/images/samsonova.jpg" },
            { id: 36, name: "Elina Svitolina", nationality: "🇺🇦", height: "174 cm", ranking: 16, points: 2790, grandSlams: ["—"], photo: "assets/images/svitolina.jpg" },
            { id: 37, name: "Beatriz Haddad Maia", nationality: "🇧🇷", height: "185 cm", ranking: 17, points: 2720, grandSlams: ["—"], photo: "assets/images/haddadmaia.jpg" },
            { id: 38, name: "Madison Keys", nationality: "🇺🇸", height: "178 cm", ranking: 18, points: 2680, grandSlams: ["—"], photo: "assets/images/keys.jpg" },
            { id: 39, name: "Victoria Azarenka", nationality: "🇧🇾", height: "183 cm", ranking: 19, points: 2625, grandSlams: ["2012 AO", "2013 AO"], photo: "assets/images/azarenka.jpg" },
            { id: 40, name: "Ons Jabeur", nationality: "🇹🇳", height: "167 cm", ranking: 20, points: 2575, grandSlams: ["—"], photo: "assets/images/jabeur.jpg" }
          ];
        }
      }

      // --------------------------------------------------------------
      // 3. RENDER function
      // --------------------------------------------------------------
      function render() {
        const sorted = [...playersData].sort((a, b) => {
          if (currentSort === 'name') {
            return a.name.localeCompare(b.name);
          } else if (currentSort === 'points') {
            return b.points - a.points;
          } else {
            return a.ranking - b.ranking;
          }
        });

        if (sorted.length === 0) {
          grid.innerHTML = `<div class="empty-state"><i class="fas fa-circle-info"></i> No players found</div>`;
          return;
        }

        const tourLabel = currentGender === 'men' ? 'ATP' : 'WTA';
        const pointsClass = currentGender === 'men' ? 'points-badge' : 'points-badge wta-points';
        const tourClass = currentGender === 'men' ? 'tour-label atp' : 'tour-label wta';

        let html = '';
        sorted.forEach(p => {
          const slamTags = p.grandSlams && p.grandSlams.length && p.grandSlams[0] !== '—'
            ? p.grandSlams.map(s => `<span class="history-tag grand-slam">🏆 ${s}</span>`).join('')
            : '<span class="history-tag">—</span>';

          const imgSrc = p.photo && p.photo.trim() !== '' ? p.photo : `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=2e7daf&color=fff&size=130`;

          // Format points with commas
          const formattedPoints = p.points ? p.points.toLocaleString() : '—';

          html += `
            <div class="player-card" data-id="${p.id}">
              <div class="card-content">
                <img class="player-img" src="${imgSrc}" alt="${p.name}" loading="lazy" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=2e7daf&color=fff&size=130'" />
                <div class="info">
                  <div class="name">
                    ${p.name}
                    <span class="flag">${p.nationality || ''}</span>
                  </div>
                  <div style="margin-top: 4px;">
                    <span class="${tourClass}">${tourLabel}</span>
                  </div>
                  <div class="detail-row">
                    <span><i class="fas fa-ruler-vertical"></i> ${p.height || '—'}</span>
                    <span><i class="fas fa-medal"></i> #${p.ranking}</span>
                    <span class="${pointsClass}">🏆 ${formattedPoints}</span>
                  </div>
                </div>
              </div>
              <div class="history-section">
                <div class="label"><i class="fas fa-trophy"></i> Grand Slam wins</div>
                <div class="history-tags">
                  ${slamTags}
                </div>
              </div>
            </div>
          `;
        });

        grid.innerHTML = html;
      }

      // --------------------------------------------------------------
      // 4. EVENT LISTENERS
      // --------------------------------------------------------------
      genderTabs.forEach(tab => {
        tab.addEventListener('click', function() {
          genderTabs.forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          currentGender = this.dataset.gender;
          loadPlayers(currentGender);
        });
      });

      sortSelect.addEventListener('change', function() {
        currentSort = this.value;
        render();
      });

      // --------------------------------------------------------------
      // 5. BOOT: load men's data by default
      // --------------------------------------------------------------
      loadPlayers('men');

      // Expose helper for console debugging
      window.__refresh = () => { loadPlayers(currentGender); };
      console.log('✅ Tennis Rankings ready. Data loaded from assets/data/');
      console.log('💡 To force refresh: window.__refresh()');
    })();
  </script>
</body>
</html>
