<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎾 Tennis Rankings · ATP & WTA Top 20</title>
  <!-- external CSS: assets/css/style.css -->
  <link rel="stylesheet" href="assets/css/style.css" />
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <div class="container">
    <!-- Navigation -->
    <nav class="main-nav">
      <ul>
        <li><a href="index.html" class="active"><i class="fas fa-trophy"></i> Rankings</a></li>
        <li><a href="history.html"><i class="fas fa-images"></i> Historical Photos</a></li>
      </ul>
    </nav>

    <header>
      <h1>
        🎾 Tennis Rankings
        <small>Top 20 · ATP & WTA</small>
      </h1>
      <div class="subhead">
        <div class="gender-tabs">
          <button class="gender-tab active" data-gender="men">Men (ATP)</button>
          <button class="gender-tab" data-gender="women">Women (WTA)</button>
        </div>
        <div class="filter-sort">
          <label for="sortSelect"><i class="fas fa-arrow-up-wide-short"></i> Sort</label>
          <select id="sortSelect">
            <option value="ranking">Ranking ▲</option>
            <option value="name">Name</option>
            <option value="points">Points ▲</option>
          </select>
        </div>
      </div>
    </header>

    <!-- waterfall grid -->
    <div id="waterfallGrid" class="waterfall"></div>

    <footer>
      <i class="fas fa-database"></i> Data updated monthly · ATP & WTA Rankings · hosted on GitHub
    </footer>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox-overlay">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightboxClose">&times;</button>
      <img id="lightboxImage" class="lightbox-image" src="" alt="Player photo" />
      <div id="lightboxCaption" class="lightbox-caption"></div>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM references
      const grid = document.getElementById('waterfallGrid');
      const sortSelect = document.getElementById('sortSelect');
      const genderTabs = document.querySelectorAll('.gender-tab');
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightboxImage');
      const lightboxCaption = document.getElementById('lightboxCaption');
      const lightboxClose = document.getElementById('lightboxClose');

      // state
      let currentGender = 'men';
      let currentSort = 'ranking';
      let playersData = [];

      // --------------------------------------------------------------
      // 1. LIGHTBOX FUNCTIONS
      // --------------------------------------------------------------
      function openLightbox(imageSrc, playerName) {
        lightboxImage.src = imageSrc;
        lightboxImage.alt = playerName;
        lightboxCaption.textContent = playerName;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
      }

      lightbox.addEventListener('click', function(e) {
        if (e.target === this) closeLightbox();
      });
      lightboxClose.addEventListener('click', closeLightbox);
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) {
          closeLightbox();
        }
      });

      // --------------------------------------------------------------
      // 2. FETCH JSON
      // --------------------------------------------------------------
      async function loadPlayers(gender) {
        try {
          const filePath = gender === 'men' ? 'assets/data/men.json' : 'assets/data/women.json';
          const response = await fetch(filePath);
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const data = await response.json();
          if (Array.isArray(data) && data.length) {
            playersData = data;
          } else {
            console.warn('JSON does not contain an array, using fallback.');
            playersData = getFallbackData(gender);
          }
        } catch (error) {
          console.warn(`Failed to load ${gender}.json, using fallback data.`, error);
          playersData = getFallbackData(gender);
        }
        render();
      }

      // --------------------------------------------------------------
      // 3. FALLBACK DATA
      // --------------------------------------------------------------
      function getFallbackData(gender) {
        if (gender === 'men') {
          return [
            { id: 1, name: "Jannik Sinner", nationality: "🇮🇹", birthYear: 2001, height: "188 cm", ranking: 1, points: 11330, grandSlams: ["2024 AO", "2024 USO"], photo: "assets/images/sinner.jpg" },
            { id: 2, name: "Alexander Zverev", nationality: "🇩🇪", birthYear: 1997, height: "198 cm", ranking: 2, points: 8135, grandSlams: ["—"], photo: "assets/images/zverev.jpg" }
          ];
        } else {
          return [
            { id: 1, name: "Iga Swiatek", nationality: "🇵🇱", birthYear: 2001, height: "176 cm", ranking: 1, points: 11185, grandSlams: ["2020 FO", "2022 FO", "2023 FO", "2024 FO"], photo: "assets/images/swiatek.jpg" },
            { id: 2, name: "Aryna Sabalenka", nationality: "🇧🇾", birthYear: 1998, height: "182 cm", ranking: 2, points: 8716, grandSlams: ["2023 AO", "2024 AO"], photo: "assets/images/sabalenka.jpg" }
          ];
        }
      }

      // --------------------------------------------------------------
      // 4. RENDER FUNCTION - WITH BIRTH YEAR
      // --------------------------------------------------------------
      function render() {
        const sorted = [...playersData].sort((a, b) => {
          if (currentSort === 'name') return a.name.localeCompare(b.name);
          if (currentSort === 'points') return b.points - a.points;
          return a.ranking - b.ranking;
        });

        if (sorted.length === 0) {
          grid.innerHTML = `<div class="empty-state"><i class="fas fa-circle-info"></i> No players found</div>`;
          return;
        }

        const tourLabel = currentGender === 'men' ? 'ATP' : 'WTA';
        const pointsClass = currentGender === 'men' ? 'points-badge' : 'points-badge wta-points';
        const tourClass = currentGender === 'men' ? 'tour-label atp' : 'tour-label wta';

        let html = '';
        sorted.forEach(p => {
          const slamTags = p.grandSlams && p.grandSlams.length && p.grandSlams[0] !== '—'
            ? p.grandSlams.map(s => `<span class="history-tag grand-slam">🏆 ${s}</span>`).join('')
            : '<span class="history-tag">—</span>';

          const imgSrc = p.photo && p.photo.trim() !== '' ? p.photo : `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=2e7daf&color=fff&size=130`;

          const formattedPoints = p.points ? p.points.toLocaleString() : '—';
          const birthYear = p.birthYear || '—';

          html += `
            <div class="player-card" data-id="${p.id}">
              <div class="card-content">
                <img class="player-img" src="${imgSrc}" alt="${p.name}" loading="lazy" 
                     onclick="openLightbox('${imgSrc}', '${p.name}')"
                     onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=2e7daf&color=fff&size=130'" />
                <div class="info">
                  <div class="name">
                    ${p.name}
                    <span class="flag">${p.nationality || ''}</span>
                  </div>
                  <div style="margin-top: 4px;">
                    <span class="${tourClass}">${tourLabel}</span>
                  </div>
                  <div class="detail-row">
                    <span><i class="fas fa-calendar"></i> ${birthYear}</span>
                    <span><i class="fas fa-ruler-vertical"></i> ${p.height || '—'}</span>
                    <span><i class="fas fa-medal"></i> #${p.ranking}</span>
                    <span class="${pointsClass}">🏆 ${formattedPoints}</span>
                  </div>
                </div>
              </div>
              <div class="history-section">
                <div class="label"><i class="fas fa-trophy"></i> Grand Slam wins</div>
                <div class="history-tags">
                  ${slamTags}
                </div>
              </div>
            </div>
          `;
        });

        grid.innerHTML = html;
      }

      // --------------------------------------------------------------
      // 5. EVENT LISTENERS
      // --------------------------------------------------------------
      genderTabs.forEach(tab => {
        tab.addEventListener('click', function() {
          genderTabs.forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          currentGender = this.dataset.gender;
          loadPlayers(currentGender);
        });
      });

      sortSelect.addEventListener('change', function() {
        currentSort = this.value;
        render();
      });

      // --------------------------------------------------------------
      // 6. BOOT
      // --------------------------------------------------------------
      loadPlayers('men');
      window.openLightbox = openLightbox;
      console.log('✅ Tennis Rankings ready. Click on any player photo to view full size!');
    })();
  </script>
</body>
</html>
