<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎾 Tennis Players · Top 20 ATP (July 2026)</title>
  <!-- external CSS: assets/css/style.css -->
  <link rel="stylesheet" href="assets/css/style.css" />
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>
        🎾 Tennis Players
        <small>Top 20 ATP · July 2026</small>
      </h1>
      <div class="subhead">
        <div class="gender-tabs">
          <button class="gender-tab active" data-gender="all">All</button>
          <button class="gender-tab" data-gender="men">Men</button>
          <button class="gender-tab" data-gender="women">Women</button>
        </div>
        <div class="filter-sort">
          <label for="sortSelect"><i class="fas fa-arrow-up-wide-short"></i> Sort</label>
          <select id="sortSelect">
            <option value="ranking">Ranking ▲</option>
            <option value="name">Name</option>
            <option value="points">Points ▲</option>
          </select>
        </div>
      </div>
    </header>

    <!-- waterfall grid -->
    <div id="waterfallGrid" class="waterfall"></div>

    <footer>
      <i class="fas fa-database"></i> Data updated monthly · ATP Rankings July 2026 · hosted on GitHub
    </footer>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM references
      const grid = document.getElementById('waterfallGrid');
      const sortSelect = document.getElementById('sortSelect');
      const genderTabs = document.querySelectorAll('.gender-tab');

      // state
      let currentGender = 'all';
      let currentSort = 'ranking';
      let playersData = [];

      // --------------------------------------------------------------
      // 1. FETCH JSON from assets/data/players.json
      // --------------------------------------------------------------
      async function loadPlayers() {
        try {
          const response = await fetch('assets/data/players.json');
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const data = await response.json();
          if (Array.isArray(data) && data.length) {
            playersData = data;
          } else {
            console.warn('JSON does not contain an array, using fallback.');
            playersData = getFallbackData();
          }
        } catch (error) {
          console.warn('Failed to load players.json, using fallback data.', error);
          playersData = getFallbackData();
        }
        render();
      }

      // --------------------------------------------------------------
      // 2. FALLBACK data (embedded) – in case JSON fetch fails
      // --------------------------------------------------------------
      function getFallbackData() {
        return [
          { id: 1, name: "Jannik Sinner", gender: "men", nationality: "🇮🇹", height: "188 cm", ranking: 1, points: 11330, grandSlams: ["2024 AO", "2024 USO"], photo: "assets/images/sinner.jpg" },
          { id: 2, name: "Alexander Zverev", gender: "men", nationality: "🇩🇪", height: "198 cm", ranking: 2, points: 8135, grandSlams: ["—"], photo: "assets/images/zverev.jpg" },
          { id: 3, name: "Carlos Alcaraz", gender: "men", nationality: "🇪🇸", height: "183 cm", ranking: 3, points: 7910, grandSlams: ["2022 USO", "2023 WB", "2024 FO"], photo: "assets/images/alcaraz.jpg" },
          { id: 4, name: "Taylor Fritz", gender: "men", nationality: "🇺🇸", height: "196 cm", ranking: 4, points: 5350, grandSlams: ["—"], photo: "assets/images/fritz.jpg" },
          { id: 5, name: "Daniil Medvedev", gender: "men", nationality: "🇷🇺", height: "198 cm", ranking: 5, points: 5035, grandSlams: ["2021 USO"], photo: "assets/images/medvedev.jpg" },
          { id: 6, name: "Casper Ruud", gender: "men", nationality: "🇳🇴", height: "183 cm", ranking: 6, points: 4565, grandSlams: ["—"], photo: "assets/images/ruud.jpg" },
          { id: 7, name: "Novak Djokovic", gender: "men", nationality: "🇷🇸", height: "188 cm", ranking: 7, points: 4510, grandSlams: ["24× GS"], photo: "assets/images/djokovic.jpg" },
          { id: 8, name: "Andrey Rublev", gender: "men", nationality: "🇷🇺", height: "188 cm", ranking: 8, points: 4420, grandSlams: ["—"], photo: "assets/images/rublev.jpg" },
          { id: 9, name: "Alex de Minaur", gender: "men", nationality: "🇦🇺", height: "183 cm", ranking: 9, points: 4195, grandSlams: ["—"], photo: "assets/images/deminaur.jpg" },
          { id: 10, name: "Tommy Paul", gender: "men", nationality: "🇺🇸", height: "185 cm", ranking: 10, points: 3860, grandSlams: ["—"], photo: "assets/images/paul.jpg" },
          { id: 11, name: "Stefanos Tsitsipas", gender: "men", nationality: "🇬🇷", height: "193 cm", ranking: 11, points: 3775, grandSlams: ["—"], photo: "assets/images/tsitsipas.jpg" },
          { id: 12, name: "Lorenzo Musetti", gender: "men", nationality: "🇮🇹", height: "185 cm", ranking: 12, points: 3650, grandSlams: ["—"], photo: "assets/images/musetti.jpg" },
          { id: 13, name: "Holger Rune", gender: "men", nationality: "🇩🇰", height: "188 cm", ranking: 13, points: 3405, grandSlams: ["—"], photo: "assets/images/rune.jpg" },
          { id: 14, name: "Jack Draper", gender: "men", nationality: "🇬🇧", height: "193 cm", ranking: 14, points: 3365, grandSlams: ["—"], photo: "assets/images/draper.jpg" },
          { id: 15, name: "Grigor Dimitrov", gender: "men", nationality: "🇧🇬", height: "191 cm", ranking: 15, points: 3235, grandSlams: ["—"], photo: "assets/images/dimitrov.jpg" },
          { id: 16, name: "Frances Tiafoe", gender: "men", nationality: "🇺🇸", height: "188 cm", ranking: 16, points: 3045, grandSlams: ["—"], photo: "assets/images/tiafoe.jpg" },
          { id: 17, name: "Hubert Hurkacz", gender: "men", nationality: "🇵🇱", height: "196 cm", ranking: 17, points: 3035, grandSlams: ["—"], photo: "assets/images/hurkacz.jpg" },
          { id: 18, name: "Ben Shelton", gender: "men", nationality: "🇺🇸", height: "193 cm", ranking: 18, points: 3000, grandSlams: ["—"], photo: "assets/images/shelton.jpg" },
          { id: 19, name: "Karen Khachanov", gender: "men", nationality: "🇷🇺", height: "198 cm", ranking: 19, points: 2935, grandSlams: ["—"], photo: "assets/images/khachanov.jpg" },
          { id: 20, name: "Ugo Humbert", gender: "men", nationality: "🇫🇷", height: "188 cm", ranking: 20, points: 2905, grandSlams: ["—"], photo: "assets/images/humbert.jpg" }
        ];
      }

      // --------------------------------------------------------------
      // 3. RENDER function
      // --------------------------------------------------------------
      function render() {
        let filtered = playersData;
        if (currentGender !== 'all') {
          filtered = filtered.filter(p => p.gender === currentGender);
        }

        const sorted = [...filtered].sort((a, b) => {
          if (currentSort === 'name') {
            return a.name.localeCompare(b.name);
          } else if (currentSort === 'points') {
            return b.points - a.points; // descending
          } else {
            return a.ranking - b.ranking;
          }
        });

        if (sorted.length === 0) {
          grid.innerHTML = `<div class="empty-state"><i class="fas fa-circle-info"></i> No players for this filter</div>`;
          return;
        }

        let html = '';
        sorted.forEach(p => {
          const slamTags = p.grandSlams && p.grandSlams.length
            ? p.grandSlams.map(s => `<span class="history-tag grand-slam">🏆 ${s}</span>`).join('')
            : '<span class="history-tag">—</span>';

          const imgSrc = p.photo && p.photo.trim() !== '' ? p.photo : `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=2e7daf&color=fff&size=130`;

          // Format points with commas
          const formattedPoints = p.points ? p.points.toLocaleString() : '—';

          html += `
            <div class="player-card" data-id="${p.id}">
              <div class="card-content">
                <img class="player-img" src="${imgSrc}" alt="${p.name}" loading="lazy" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=2e7daf&color=fff&size=130'" />
                <div class="info">
                  <div class="name">
                    ${p.name}
                    <span class="flag">${p.nationality || ''}</span>
                  </div>
                  <div class="detail-row">
                    <span><i class="fas fa-ruler-vertical"></i> ${p.height || '—'}</span>
                    <span><i class="fas fa-medal"></i> #${p.ranking}</span>
                    <span class="points-badge">🏆 ${formattedPoints}</span>
                  </div>
                  <div style="margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap;">
                    <span class="stat-badge"><i class="fas fa-venus-mars"></i> ${p.gender}</span>
                  </div>
                </div>
              </div>
              <div class="history-section">
                <div class="label"><i class="fas fa-trophy"></i> Grand Slam wins</div>
                <div class="history-tags">
                  ${slamTags}
                </div>
              </div>
            </div>
          `;
        });

        grid.innerHTML = html;
      }

      // --------------------------------------------------------------
      // 4. EVENT LISTENERS
      // --------------------------------------------------------------
      genderTabs.forEach(tab => {
        tab.addEventListener('click', function() {
          genderTabs.forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          currentGender = this.dataset.gender;
          render();
        });
      });

      sortSelect.addEventListener('change', function() {
        currentSort = this.value;
        render();
      });

      // --------------------------------------------------------------
      // 5. BOOT: load JSON
      // --------------------------------------------------------------
      loadPlayers();

      // Expose helper for console debugging
      window.__refresh = () => { loadPlayers(); };
      console.log('✅ Tennis Waterfall ready. Data loaded from assets/data/players.json');
      console.log('💡 To force refresh: window.__refresh()');
    })();
  </script>
</body>
</html>
